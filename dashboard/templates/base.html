<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Whale Sighting Tracker{% endblock %}</title>
  <style>
    :root {
      /* dataviz skill reference palette, light mode -- chart chrome tokens
         reused here so the page and the charts/legend never drift apart */
      --surface:   #fcfcfb;
      --page:      #f9f9f7;
      --ink:       #0b0b0b;
      --ink-2:     #52514e;
      --ink-muted: #898781;
      --gridline:  #e1e0d9;
      --border:    rgba(11, 11, 11, 0.10);
      --accent:    #2a78d6;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
      color: var(--ink);
      background: var(--page);
      line-height: 1.5;
    }

    nav {
      display: flex;
      gap: 1.5rem;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--gridline);
      margin-bottom: 1.75rem;
    }
    nav a {
      color: var(--ink-2);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    nav a:hover { color: var(--accent); }

    h1 { font-size: 1.6rem; margin: 0 0 0.4rem; color: var(--ink); }
    h2 { font-size: 1.15rem; margin: 1.75rem 0 0.75rem; color: var(--ink); }
    p.lede { color: var(--ink-2); margin: 0 0 1.5rem; max-width: 60ch; }

    ul { padding-left: 1.1rem; }
    li { margin-bottom: 0.25rem; color: var(--ink-2); }
    li strong { color: var(--ink); }
    a { color: var(--accent); }

    table.pivot-table {
      border-collapse: collapse;
      margin: 0.5rem 0 1.5rem;
      font-size: 0.85rem;
      background: var(--surface);
      box-shadow: 0 1px 2px var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    table.pivot-table th, table.pivot-table td {
      border: 1px solid var(--gridline);
      padding: 6px 12px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    table.pivot-table th {
      background: var(--surface);
      color: var(--ink-2);
      font-weight: 600;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--gridline);
      border-radius: 8px;
      padding: 0.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 1px 3px var(--border);
    }
    .chart-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 720px) {
      .chart-pair { grid-template-columns: 1fr; }
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--gridline);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.5rem;
    }
    .filter-bar label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.8rem;
      color: var(--ink-2);
      font-weight: 600;
    }
    .filter-bar input, .filter-bar select {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--gridline);
      border-radius: 5px;
      background: var(--page);
      color: var(--ink);
    }
    .filter-bar button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.45rem 1rem;
      border: none;
      border-radius: 5px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      height: fit-content;
    }
    .filter-bar button:hover { opacity: 0.9; }
    .clear-filters {
      font-size: 0.8rem;
      align-self: center;
      color: var(--ink-2);
      text-decoration: underline;
    }
    .filter-note {
      font-size: 0.78rem;
      color: var(--ink-muted);
      margin: 0.4rem 0 1.25rem;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--gridline);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin: 0 0 1.75rem;
      box-shadow: 0 1px 3px var(--border);
    }
    .summary-heading {
      margin: 0 0 0.4rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-2);
    }
    .summary-total {
      margin: 0 0 0.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }
    .summary-list { margin: 0; padding-left: 1.1rem; }
    .summary-list li { color: var(--ink-2); margin-bottom: 0.2rem; }
    .summary-list strong { color: var(--ink); }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/map">Map</a>
    <a href="/analysis">Analysis</a>
    <a href="/pivots">Pivot tables</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
